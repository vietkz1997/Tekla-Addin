** This is an example configuration file for NC file classifier
** for Peddimat for Windows output format
**
** FILTERING OPTIONS
**
** N [Machine name]
N Example Machine
**
** Maximum size
** S [length]  [width]  [height]
S 15000 4000 4000
**
** Accepted profile types
** P [IULMRBCT]
P ILMU
**
** Maximum holes
** H [hole count]
** [maximum diameter for thickness]  [thickness]
H 2
2000 30
60 45
**
** TRANSLATION OPTIONS
**
** POP-mark options
** T = Thrill through marks on back side, if there are no other items on
**     back side, diameter = mark hole diameter
** R = Rotate part, if there are items on back side and none on front side. 
**     If T is selected, rotate also if more marks on back side than front side 
**     and no other items on front side.
** D = Delete mark if overlapping with hole
** M [T diameter] [R] [D]
M T 1.0 D
**
** Longhole (slot) conversion
** D = Delete
** C = Hole at center
** H = Holes to corners/ends
** I = Internal contour
** L [D | C | H | I]
L
**
** Convert large holes to internal contour
** I [maximum diameter not to be converted]
I 60
**
** Calculate the part origin without copes
** (This has effect only when mitre and cope on the left end of the part)
** X = Enable option
** [X]
X
**
** Output format
** D = DSTV (default)
** P = Peddimat
** F [D | P [copes directory]]
** P = Peddimat (Custom cope options: D = Peddimat for DOS, S = Single file,
**               C = Combined files for part ends)
** F [D | P [[copes directory] [D] [S|C]]]
F P c:\peddimat\copes
