set XS_USE_FAST_RENDERING=TRUE

/*~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~*/
/*  Section 5 - Drawing Settings (TCVN Standard)                   */
/*~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~*/
set XS_DEFAULT_FONT=Segoe UI semibold
set XS_DEFAULT_FONT_SIZE=12
set XS_ARC_WIDTH_OF_CLOUD=5
set XS_USE_COLOR_DRAWINGS=TRUE
set XS_BLACK_DRAWING_BACKGROUND=TRUE
set XS_OPEN_DRAWINGS_MAXIMIZED=TRUE
set XS_DO_NOT_CREATE_ASSEMBLY_DRAWINGS_FOR_CONCRETE_PARTS=FALSE
set XS_DRAWING_POINT_SCALE=0.25
set XS_DRAWING_GA_HATCH_SCHEMA=gadrawing.htc