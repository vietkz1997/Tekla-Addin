set XS_ENABLE_POUR_MANAGEMENT=TRUE
set XS_REBAR_DIMENSION_MARK_ALL_REBARS_IN_GROUP=TRUE
set XS_USE_EXISTING_REBAR_CATALOG_FORMAT=TRUE

/*~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~*/
/*  Section 4 - Modeling & View Settings (Modern DirectX)          */
/*~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~*/
set XS_CHAMFER_ACCURACY_FACTOR=4.0
set XS_SOLID_BUFFER_SIZE=480000
set XS_CHANGE_WORKAREA_WHEN_MODIFYING_VIEW_DEPTH=FALSE
set XS_ENABLE_MIDDLE_BUTTON_DOUBLE_CLICK_ZOOM_ORIGINAL=TRUE
set XS_SHOW_PROGRESS_BAR_FOR_PROJECT_STATUS_VISUALIZATION=FALSE
