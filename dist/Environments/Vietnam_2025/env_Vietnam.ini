/*  Section 2 - Profile & Material Settings                        */
/*~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~*/
set XS_USER_DEFINED_PARAMETRIC_PROFILE_SEPARATORS=X,x,*,-
set XS_PARAMETRIC_PROFILE_SEPARATOR=X
set XS_MAX_DECIMALS_IN_PROFILE_NAME=0

/*~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~*/
/*  Section 3 - Concrete & Rebar (TCVN Standards for 2025)         */
/*~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~*/
set XS_IMPERIAL=FALSE
set XS_MAX_REBAR_LENGTH=11700
set XS_USE_USER_DEFINED_REBAR_LENGTH_AND_WEIGHT=TRUE
set XS_USE_ONLY_NOMINAL_REBAR_DIAMETER=TRUE
set XS_USER_DEFINED_REBARSHAPERULES=TRUE
set XS_REBAR_MARK_PULLOUT_TEXT_PLACEMENT_OFFSET=1.0
